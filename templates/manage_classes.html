{% extends 'base.html' %}
{% block content %}
<h2>Class / Section Management</h2>
<div class="card p-3 mb-3">
  <form method="post" class="row g-2">
    <input type="hidden" name="action" value="create">
    <div class="col-md-3"><input name="course_name" class="form-control" placeholder="Course Name" required></div>
    <div class="col-md-2"><input name="section_label" class="form-control" placeholder="Period 3" required></div>
    <div class="col-md-2"><input name="slug" class="form-control" placeholder="slug" required></div>
    <div class="col-md-3"><input name="description" class="form-control" placeholder="Description"></div>
    <div class="col-md-1"><input type="color" name="color" class="form-control form-control-color" value="#77808a"></div>
    <div class="col-md-1"><button class="btn btn-primary">Add</button></div>
  </form>
</div>
<table class="table table-striped table-dark align-middle">
<thead><tr><th>Course</th><th>Section</th><th>Students</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>
{% for c in classes %}
<tr>
  <td>{{ c.course_name }}</td><td>{{ c.section_label }}</td><td>{{ c.enrollments|length }}</td><td>{% if c.archived %}Archived{% else %}Active{% endif %}</td>
  <td class="d-flex gap-2">
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('class_portal', slug=c.slug) }}">Open</a>
    <form method="post"><input type="hidden" name="action" value="archive"><input type="hidden" name="class_id" value="{{ c.id }}"><button class="btn btn-sm btn-outline-warning">Archive</button></form>
    <form method="post"><input type="hidden" name="action" value="duplicate"><input type="hidden" name="class_id" value="{{ c.id }}"><button class="btn btn-sm btn-outline-info">Duplicate Structure</button></form>
  </td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
